[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritasrag"
version = "0.1.0"
description = "Real-Time Hallucination-Flagging Middleware Layer for RAG Pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "sentence-transformers>=2.3.0",
    "spacy>=3.7.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
nli = [
    "transformers>=4.38.0",
    "torch>=2.2.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
